[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phenospace"
version = "0.1.0"
description = "Phenotype-space research codebase (developed for Cytognosis, cytognosis.org) — ontology-guided embedding, synthetic population, and GNN/AANet archetype pipelines for psychological-assessment data."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Ali Mohammadi" }]
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5,<2.6",
    "torch-geometric>=2.8,<2.9",
    "anndata>=0.10,<0.12",
    "scipy>=1.10,<2",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
phenospace-demo = "phenospace.graph_models.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Legacy working trees (scripts/, experiments/, notebooks/, archive/) are
# pinned byte-identical to the provenance manifests; they are intentionally
# outside the lint surface. src/, tools/, tests/, configs/ are maintained
# lint-clean.
extend-exclude = ["archive", "scripts", "experiments", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"