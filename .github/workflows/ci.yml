name: CPU package checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[ml,dev]'
      - run: ruff check src tests tools
      - run: ruff format --check src/phenospace/graph_models tests/test_graph_pipeline.py
      - run: pytest
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: cd "$RUNNER_TEMP" && phenospace-demo --output "$RUNNER_TEMP/phenospace-demo"
