# phenospace — Data Sources & Governance
# ========================================
# Canonical registry of every data input consumed by the repository.
# Raw files are NOT committed to VCS; they are reconstructed from the
# sources below or regenerated by the pipeline. Checksums for all captured
# files live in reports/repository_audit/original_file_inventory.csv.

registries:

  - id: tdpa_zenodo_10423537
    description: >
      Temporal dynamics of psychological assessments (TDPA) Zenodo release —
      de-identified raw questionnaire exports (PHQ-9, GAD-7, ISI, PSS,
      demographics).
    kind: raw
    source_url: https://zenodo.org/records/10423537
    licence: zenodo-open
    accessibility: public (de-identified)
    files:
      - rel: data/raw/questionnaires/phq9.csv
        md5: ~   # see inventory manifest
      - rel: data/raw/questionnaires/gad7.csv
      - rel: data/raw/questionnaires/isi.csv
      - rel: data/raw/questionnaires/pss.csv
      - rel: data/raw/questionnaires/demographic.csv

  - id: hp_ontology
    description: HPO human phenotype ontology (hp.obo).
    kind: raw
    source_url: https://hpo.jax.org/app/download/ontology
    licence: HPO terms CC BY 4.0
    files:
      - rel: data/raw/ontology/hp.obo

  - id: hpoa
    description: HPO annotations (phenotype.hpoa).
    kind: raw
    source_url: https://hpo.jax.org/app/download/annotations
    licence: HPO terms CC BY 4.0
    files:
      - rel: data/raw/ontology/phenotype.hpoa

  - id: mondo_teacher_vectors
    description: >
      Mondo disease-space teacher vectors for the LLM metric fine-tuning /
      disease-classifier task (MONDO IDs → teacher index + cosine-distance
      matrix).
    kind: derived
    producer: scripts/disease_mapping/phase2_curate_disease_set.py
    files:
      - rel: artifacts/teacher_distances/mondo_teacher_dist.npy
      - rel: data/processed/disease_mapping/mondo_teacher_index.json

  - id: phenotype_axes_catalog
    description: >
      Canonical phenotype-axes catalog, test registry and HPO→axis weight
      matrix used by the projection engine.
    kind: curated
    producer: scripts/projection_engine/build_phenotype_axes_v0.py
    files:
      - rel: data/processed/phenotype_axes/phenotype_axes_v0_reviewed.csv
      - rel: data/processed/phenotype_axes/hpopp_phenotype_cards.jsonl
      - rel: data/processed/phenotype_axes/test_registry_mapping_v1.csv

  - id: synthetic_population
    description: Synthetic cohort projections and response logs (balanced v0.1).
    kind: derived
    producer: scripts/synthetic_population/synthetic_population_generator_v0_1.py
    files:
      - rel: experiments/synthetic_population/synthetic_population_balanced_manifest_v0_1.json
      - rel: configs/synthetic_population/synthetic_population_balanced_manifest_v0_1.json

  - id: real_temporal_assessments
    description: >
      Prepared real questionnaire data — canonical wide table, RT features and
      the merged temporal-RT phenotype analysis table (v7d, patched ISI).
    kind: derived
    producer: experiments/real_data_pipeline/00_code/prepare_temporal_assessment_dataset_v0.py
    files:
      - rel: experiments/real_data_pipeline/03_processed_data/temporal_assessment_canonical_wide_v0_rt_patched.csv
      - rel: experiments/real_data_pipeline/03_processed_data/temporal_assessment_rt_features_v0_rt_patched.csv
      - rel: experiments/real_data_pipeline/03_processed_data/temporal_rt_phenotype_analysis_table_v7d_score_fixed_patched_isi_rt_patched.csv

  - id: archetype_model_outputs
    description: Real-data archetype model outputs (v7d, ISI-patched run).
    kind: derived
    producer: experiments/real_data_pipeline/00_code/real_archetype_model_v0.py
    files:
      - rel: experiments/real_data_pipeline/05_real_archetype_outputs/real_archetype_outputs_v7d_score_fixed_patched_isi/real_phenotype_archetypes_v0.json
      - rel: experiments/real_data_pipeline/05_real_archetype_outputs/real_archetype_outputs_v7d_score_fixed_patched_isi/real_user_archetype_assignments_v0.csv

  - id: aanet_gnn_outputs
    description: AANet bottleneck GNN + anndata artifacts (v0.1).
    kind: derived
    producer: experiments/real_data_pipeline/11_anndata/code/train_aanet_bottleneck_gnn_v0_1.py
    files:
      - rel: experiments/real_data_pipeline/11_anndata/outputs/aanet_bottleneck_gnn_v0_1.pt
      - rel: experiments/real_data_pipeline/11_anndata/outputs/real_phenotype_data_v0_3_aanet.h5ad
      - rel: experiments/real_data_pipeline/11_anndata/outputs/real_phenotype_data_v0.soma
